<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARAFAT VAI</title>
<style>
  :root{
    --bg:#05070a;
    --panel:#0b1210;
    --line:#1c2a24;
    --green:#7CFF3A;
    --green-dim:#3d7a1f;
    --purple:#8b7cff;
    --text:#e9f5ea;
    --text-dim:#8ea593;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:\'Segoe UI\', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 22px 40px;
    position:relative;
    overflow:hidden;
  }
  /* ambient glow background */
  .page::before{
    content:"";
    position:absolute;
    top:-120px; left:50%;
    transform:translateX(-50%);
    width:520px; height:520px;
    background:radial-gradient(circle, rgba(124,255,58,0.16) 0%, rgba(124,255,58,0) 65%);
    pointer-events:none;
  }
  .page::after{
    content:"";
    position:absolute;
    bottom:-160px; left:50%;
    transform:translateX(-50%);
    width:600px; height:600px;
    background:radial-gradient(circle, rgba(139,124,255,0.10) 0%, rgba(139,124,255,0) 65%);
    pointer-events:none;
  }

  .status{
    align-self:flex-end;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    letter-spacing:2px;
    color:var(--text-dim);
    z-index:2;
  }
  .status .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px 2px rgba(124,255,58,0.7);
  }

  .logo-wrap{
    margin-top:22px;
    width:190px; height:190px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    z-index:2;
  }
  .logo-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:50%;
    box-shadow:
      0 0 0 2px rgba(124,255,58,0.35),
      0 0 40px 6px rgba(124,255,58,0.35),
      0 0 80px 20px rgba(139,124,255,0.18);
  }

  .brand{
    margin-top:26px;
    text-align:center;
    z-index:2;
  }
  .brand h1{
    font-size:26px;
    letter-spacing:3px;
    font-weight:700;
    background:linear-gradient(180deg,#fff 0%, var(--green) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 22px rgba(124,255,58,0.35);
  }
  .brand .tagline{
    margin-top:10px;
    font-size:12px;
    letter-spacing:3px;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  .divider{
    margin-top:18px;
    width:80%;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--green-dim), transparent);
    z-index:2;
  }

  /* chart card */
  .card{
    margin-top:26px;
    width:100%;
    background:linear-gradient(180deg, rgba(20,32,26,0.9), rgba(10,16,13,0.9));
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 16px 14px;
    z-index:2;
    box-shadow:0 0 0 1px rgba(124,255,58,0.05), 0 20px 40px rgba(0,0,0,0.4);
  }
  .card svg{
    width:100%;
    height:150px;
    display:block;
  }
  .stats{
    margin-top:14px;
    display:flex;
    justify-content:space-between;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .stat{
    text-align:center;
    flex:1;
  }
  .stat .label{
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  .stat .value{
    margin-top:6px;
    font-size:15px;
    font-weight:700;
    color:var(--green);
  }
  .stat:not(:last-child){
    border-right:1px solid var(--line);
  }

  .sub{
    margin-top:22px;
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
    letter-spacing:0.5px;
    z-index:2;
  }

  .spacer{ flex:1; }

  .cta{
    margin-top:30px;
    width:100%;
    z-index:2;
  }
  .cta a{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:16px 0;
    background:linear-gradient(180deg, #9dff4f, #5fbf1e);
    color:#08130a;
    font-weight:800;
    font-size:16px;
    letter-spacing:2px;
    text-decoration:none;
    border-radius:12px;
    box-shadow:0 0 30px rgba(124,255,58,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta a:active{
    transform:scale(0.97);
    box-shadow:0 0 15px rgba(124,255,58,0.25);
  }

  .foot-mark{
    margin-top:16px;
    font-size:10px;
    letter-spacing:4px;
    color:#4a5c50;
    z-index:2;
  }

  @media (prefers-reduced-motion: no-preference){
    .logo-wrap img{
      animation: pulse 3.5s ease-in-out infinite;
    }
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 2px rgba(124,255,58,0.35), 0 0 40px 6px rgba(124,255,58,0.35), 0 0 80px 20px rgba(139,124,255,0.18); }
    50%{ box-shadow:0 0 0 2px rgba(124,255,58,0.5), 0 0 55px 10px rgba(124,255,58,0.5), 0 0 100px 26px rgba(139,124,255,0.28); }
  }

  a:focus-visible, .cta a:focus-visible{
    outline:2px solid var(--green);
    outline-offset:3px;
  }
</style>
</head>
